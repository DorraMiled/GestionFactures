<div class="card">
  <h2>{{isEditing ? 'Modifier' : 'Ajouter'}} un client</h2>
  
  <div *ngIf="error" class="alert alert-error">{{error}}</div>
  
  <form (ngSubmit)="saveClient()">
    <div class="form-group">
      <label>Code Client *</label>
      <input type="text" [(ngModel)]="formData.codeClient" name="codeClient" required>
    </div>
    
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" [(ngModel)]="formData.nom" name="nom" required>
    </div>
    
    <div class="form-group">
      <label>Adresse</label>
      <input type="text" [(ngModel)]="formData.adresse" name="adresse">
    </div>
    
    <div class="flex">
      <div class="form-group" style="flex: 1;">
        <label>Ville</label>
        <input type="text" [(ngModel)]="formData.ville" name="ville">
      </div>
      
      <div class="form-group" style="flex: 1;">
        <label>Code Postal</label>
        <input type="text" [(ngModel)]="formData.codePostal" name="codePostal">
      </div>
    </div>
    
    <div class="form-group">
      <label>Pays</label>
      <input type="text" [(ngModel)]="formData.pays" name="pays">
    </div>
    
    <div>
      <button type="submit" class="btn btn-primary">
        {{isEditing ? 'Modifier' : 'Créer'}}
      </button>
      <button type="button" class="btn btn-secondary" (click)="resetForm()">
        Annuler
      </button>
    </div>
  </form>
</div>

<div class="card">
  <h2>Liste des clients</h2>
  
  <div *ngIf="loading" class="loading">Chargement...</div>
  
  <table *ngIf="!loading && clients.length > 0">
    <thead>
      <tr>
        <th>Code</th>
        <th>Nom</th>
        <th>Ville</th>
        <th>Pays</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let client of clients">
        <td>{{client.codeClient}}</td>
        <td>{{client.nom}}</td>
        <td>{{client.ville}}</td>
        <td>{{client.pays}}</td>
        <td>
          <button class="btn btn-primary" (click)="editClient(client)">Modifier</button>
          <button class="btn btn-danger" (click)="deleteClient(client.id!)">Supprimer</button>
        </td>
      </tr>
    </tbody>
  </table>
  
  <p *ngIf="!loading && clients.length === 0" class="text-center">
    Aucun client trouvé
  </p>
</div>
